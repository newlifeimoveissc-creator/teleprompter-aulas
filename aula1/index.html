:root{--noite:#100C0A;--bloco:#2C2522;--marfim:#FAF9F5;--laranja:#D97757;--fs:36px;--guia:34vh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--noite)}
body{margin:0;background:var(--noite);color:var(--marfim);font-family:Satoshi,-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#texto{max-width:940px;margin:0 auto;padding:var(--guia) max(22px,6vw) 78vh;font-size:var(--fs);line-height:1.5;font-weight:500;transition:transform .2s}
body.espelho #texto{transform:scaleX(-1)}
.capa{font-family:Excon,Satoshi,system-ui,sans-serif;font-weight:700;font-size:1.05em;line-height:1.15;margin:0 0 .4em}
.capa small{display:block;font-family:Satoshi,system-ui,sans-serif;font-weight:500;font-size:.42em;letter-spacing:.14em;text-transform:uppercase;color:var(--laranja);margin-bottom:.6em}
.dica{font-size:.42em;line-height:1.5;color:#A69C90;margin:0 0 2.2em}
.cab{font-size:.42em;letter-spacing:.16em;text-transform:uppercase;color:var(--laranja);font-weight:700;margin:2.6em 0 1em;padding-top:1em;border-top:1px solid #3a302b}
.cab span{color:#8E847A;font-weight:500;letter-spacing:.08em}
p.fala{margin:0 0 .85em}
p.gesto{margin:0 0 .85em;font-size:.6em;color:var(--laranja);font-style:italic;font-weight:700}
p.gesto:before{content:"[ "}p.gesto:after{content:" ]"}
.pedido{margin:0 0 .9em;font-size:.52em;line-height:1.45;color:#D8CFC4;border-left:3px solid var(--laranja);padding:.5em .8em;background:#1b1512}
.pedido b{display:block;font-size:.72em;letter-spacing:.14em;color:#A69C90;margin-bottom:.3em}
mark{background:none;color:#fff;font-weight:700;border-bottom:.08em solid var(--laranja)}
.fim{margin:1.4em 0 0;font-size:.38em;letter-spacing:.14em;text-transform:uppercase;color:#6f665d;display:flex;align-items:center;gap:.8em}
.fim:before,.fim:after{content:"";flex:1;border-top:1px dashed #4a403a}
.acabou{text-align:center;margin-top:2em;font-size:.6em;color:var(--laranja);font-weight:700}
/* guia de leitura */
#guia{position:fixed;left:0;right:0;top:var(--guia);height:0;pointer-events:none;z-index:5}
#guia:before,#guia:after{content:"";position:absolute;top:-.55em;border:.55em solid transparent;font-size:var(--fs)}
#guia:before{left:4px;border-left-color:var(--laranja)}
#guia:after{right:4px;border-right-color:var(--laranja)}
#sombraT,#sombraB{position:fixed;left:0;right:0;pointer-events:none;z-index:4}
#sombraT{top:0;height:calc(var(--guia) - .4em);background:linear-gradient(var(--noite) 20%,rgba(16,12,10,.25))}
#sombraB{bottom:0;height:34vh;background:linear-gradient(rgba(16,12,10,0),var(--noite) 85%)}
/* progresso */
#topo{position:fixed;top:0;left:0;right:0;z-index:8;padding:calc(env(safe-area-inset-top) + 6px) 14px 6px;display:flex;align-items:center;gap:10px;font-size:12px;color:#A69C90;transition:opacity .3s}
#barra{flex:1;height:3px;background:#2C2522;border-radius:2px;overflow:hidden}
#barra i{display:block;height:100%;width:0;background:var(--laranja)}
/* controles */
#ctl{position:fixed;left:0;right:0;bottom:0;z-index:9;background:rgba(36,29,26,.96);border-top:1px solid #3a302b;padding:10px 12px calc(10px + env(safe-area-inset-bottom));transition:transform .3s,opacity .3s}
body.rodando #ctl{transform:translateY(110%);opacity:0}
body.rodando #topo{opacity:.35}
.lin{display:flex;align-items:center;justify-content:space-between;gap:6px;max-width:620px;margin:0 auto}
.lin+.lin{margin-top:9px}
button{font:inherit;color:var(--marfim);background:#3a302b;border:0;border-radius:12px;min-width:40px;height:44px;padding:0 9px;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}
button:active{background:#4a3e38}
button.on{background:var(--laranja);color:#1b0f0a}
#play{min-width:68px;height:56px;border-radius:28px;background:var(--laranja);color:#1b0f0a;font-size:22px}
.val{min-width:38px;text-align:center;font-size:13px;color:#cfc6bb;line-height:1.15}
.val b{display:block;font-size:17px;color:var(--marfim)}
.peq{font-size:13px;font-weight:500;height:38px;padding:0 8px;white-space:nowrap;flex:1}
/* contagem e menu */
#conta{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(16,12,10,.8);font-family:Excon,Satoshi,system-ui,sans-serif;font-weight:700;font-size:38vw;color:var(--laranja)}
#menu{position:fixed;inset:0;z-index:30;display:none;background:rgba(16,12,10,.97);overflow:auto;padding:calc(env(safe-area-inset-top) + 20px) 20px 30px}
#menu h3{font-family:Excon,Satoshi,system-ui,sans-serif;margin:0 0 14px;font-size:20px}
#menu button{display:block;width:100%;max-width:560px;margin:0 auto 10px;text-align:left;height:auto;padding:14px 16px;font-size:17px;line-height:1.3}
#menu button small{display:block;font-weight:500;font-size:13px;color:#A69C90;margin-top:3px}
#menu button.atual{outline:2px solid var(--laranja)}
@media (orientation:landscape) and (max-height:540px){
:root{--guia:24vh}
#texto{padding-left:max(28px,env(safe-area-inset-left),5vw);padding-right:max(28px,env(safe-area-inset-right),5vw);max-width:none;line-height:1.42}
#topo{padding:4px max(14px,env(safe-area-inset-left)) 4px}
#sombraB{height:26vh}
#ctl{display:flex;gap:10px;align-items:center;padding:6px max(12px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.lin{margin:0;max-width:none;flex:1}
.lin+.lin{margin-top:0}
button{height:38px;min-width:38px}
#play{height:42px;min-width:60px;font-size:19px}
.peq{height:38px;font-size:12px}
.val{font-size:11px}.val b{font-size:15px}
#conta{font-size:30vh}
}
</style>
</head>

<main id="texto"></main>

</div>

<script>
const DADOS = {"titulo": "Aula 1 · A IA que trabalha por você", "partes": [{"n": "1", "nome": "Boas-vindas", "meta": "2 min · câmera", "fica": ["No fim deste curso, você vai ter uma equipe de marketing trabalhando pra você."], "itens": [{"t": "fala", "x": "Seja muito bem-vindo. E antes de qualquer coisa: parabéns. Muita gente assiste aquele vídeo, acha interessante e fecha a página. Você não fechou. Você decidiu que o seu domingo não vai mais pro CapCut."}, {"t": "fala", "x": "E eu quero que você saiba desde já aonde a gente vai chegar. No fim deste curso, você vai ter uma equipe de marketing trabalhando pra você. Uma equipe que escreve o roteiro, faz a narração, edita o vídeo, cria a capa e organiza o seu mês de conteúdo. Ela não tem salário, não falta e não tira férias, porque ela é feita de agentes de inteligência artificial trabalhando pra você."}, {"t": "fala", "x": "Olha isso aqui. Tudo o que está passando agora foi feito pela minha equipe de IA, a partir de pedidos que eu escrevi em português, do mesmo jeito que eu estou falando com você."}, {"t": "fala", "x": "E o curso funciona assim: são seis aulas curtas. Você vai usar um imóvel seu do começo ao fim, e em toda aula você termina fazendo alguma coisa sozinho, no seu computador. Esta primeira aula é a base de tudo. Aqui você vai entender que tipo de IA é essa, como ela trabalha e por que ela muda o jogo pro corretor. Então fica comigo até o final, porque o resto do curso se apoia nela."}]}, {"n": "2", "nome": "O gesto", "meta": "1 min · câmera", "fica": ["Você não precisa aprender nenhuma dessas. Eu vou te ensinar a usar essa aqui."], "itens": [{"t": "fala", "x": "E pra você chegar lá, eu tenho uma notícia que vai te aliviar. Se você abrir a internet hoje, vai encontrar um monte de nome de inteligência artificial. Tem o ChatGPT, que escreve. Tem o ElevenLabs, que cria uma voz igual à humana. Tem o Higgsfield, que faz o vídeo de um prédio que ainda nem saiu do chão. Tem o CapCut, tem o Canva, e toda semana ap ela agora há pouco são os pedreiros. Cada uma é muito boa numa coisa só: uma faz a voz, outra faz o vídeo, outra faz a imagem. O Claude é o engenheiro. Quando o trabalho precisa de voz, ele chama a voz. Quando precisa de vídeo, ele chama o vídeo. E você é o dono da obra. Você não precisa saber assentar tijolo. Você precisa saber pedir pro engenheiro."}, {"t": "fala", "x": "E repara no que isso significa pra você, corretor. Você não vai precisar aprender dez aplicativos. Você aprende a comandar um. E quando amanhã surgir uma IA nova, melhor do que todas essas, quem aprende a usar é o engenheiro, não você."}]}, {"n": "4", "nome": "A obra por dentro", "meta": "5 min · câmera", "fica": ["Canteiro, planta, caderno, tijolo, telefone e manual. O curso inteiro é sobre essas seis peças."], "itens": [{"t": "fala", "x": "Agora eu vou te mostrar a obra por dentro. São seis peças. Cada uma é uma parte do Claude que você vai aprender a usar, e o curso inteiro é sobre elas. Guarda esses seis nomes."}, {"t": "fala", "x": "A primeira é o canteiro. O engenheiro só trabalha dentro do canteiro que você liberar, e no computador o canteiro é uma pasta. Você cria uma pasta com as fotos, os vídeos e os dados de um imóvel e libera só ela. O resto do seu computador continua fechado. Então, se você estava com medo de ele mexer nas suas coisas: ele só mexe no que você liberar. É a peça de hoje."}, {"t": "fala", "x": "A segunda é a planta, que é o seu pedido. Engenheiro bom com planta ruim faz obra errada. E a maioria das pessoas pede pra IA do jeito errado, por isso acha que a IA é fraca. Na próxima aula eu te ensino o meu jeito de pedir, que faz ele acertar de primeira."}, {"t": "fala", "x": "A terceira é o caderno de obra. Toda obra tem um caderno onde fica anotado tudo o que o engenheiro precisa saber. No Claude, é uma ficha sua: quem você é, onde trabalha, quem é o seu cliente e como você fala. Você escreve uma vez, e ele lê antes de começar qualquer trabalho. É por isso que, com o tempo, ele passa a escrever do seu jeito. Também é assunto da próxima aula."}, {"t": "fala", "x": "A quarta é o tijolo, que é o código. Quando o Claude está trabalhando, você vai ver um texto colorido passando na tela. Aquilo é código, é ele assentando o tijolo. Você não precisa ler nem entender nada daquilo, porque quem assenta é ele. Na aula 3, esse tijolo vira o seu primeiro vídeo."}, {"t": "fala", "x": "A quinta é o telefone dos pedreiros. O engenheiro tem uma agenda com o contato de cada pedreiro, e no Claude essa agenda são as conexões. É por elas que ele chama a voz, o vídeo e a imagem. Isso é a aula 4."}, {"t": "fala", "x": "E a sexta é o manual de procedimento. Quando um trabalho deu certo, você não quer explicar tudo de novo na semana seguinte. Então você escreve o procedimento uma vez, e daí em diante basta dizer 'faz o Reels desse imóvel' que ele faz do mesmo jeito. No Claude, esse manual tem um nome: skill. Isso é a aula 5."}, {"t": "fala", "x": "E quando essas seis peças estão no lugar, a obra está pronta. Você tem a sua equipe trabalhando, e é isso que a gente monta junto na aula 6."}, {"t": "fala", "x": "Canteiro, planta, caderno, tijolo, telefone e manual. O curso inteiro é sobre essas seis peças."}]}, {"n": "5", "nome": "O engenheiro trabalhando", "meta": "3 min · tela", "fica": ["Eu pedi uma vez. A equipe inteira trabalhou."], "itens": [{"t": "fala", "x": "Agora eu quero que você veja o engenheiro trabalhando, com a equipe inteira. Esta é a minha máquina, que eu uso todo dia. Nesta pasta tem os vídeos que eu gravei de um apartamento com o celular. Olha o pedido que eu vou fazer."}, {"t": "pedido", "x": "Pega os vídeos dessa pasta, escreve um roteiro de 30 segundos sobre esse apartamento, faz a narração e monta o Reels com legenda e música. Salva aqui na pasta."}, {"t": "fala", "x": "Repara no que ele está fazendo. Primeiro, ele olhou os vídeos pra entender o apartamento. Agora ele está escrevendo o roteiro. Aqui ele chamou o pedreiro da voz e a narração chegou. Agora está cortando os vídeos no ritmo da fala, e aqui ele colocou a legenda."}, {"t": "fala", "x": "Pronto, olha o resultado."}, {"t": "gesto", "x": "o Reels toca inteiro, com som"}, {"t": "fala", "x": "Eu pedi uma vez. A equipe inteira trabalhou. Uma pessoa sozinha levaria uma noite inteira pra fazer isso. E você não precisa saber fazer isso hoje: é aonde você vai chegar até o fim deste curso, uma peça por aula."}]}, {"n": "6", "nome": "O caminho", "meta": "1 min · câmera", "fica": ["O botão muda de lugar. As peças da obra continuam as mesmas."], "itens": [{"t": "fala", "x": "Então olha o caminho. Hoje você monta o seu canteiro e dá a primeira ordem. Na aula 2, aprende a desenhar a planta e escreve o caderno de obra, e o Claude passa a falar do seu jeito. Na aula 3, sai o seu primeiro vídeo sem CapCut. Na 4, os pedreiros entram na obra: voz e vídeo com IA. Na 5, você escreve o seu primeiro manual e ele passa a fazer sozinho. E na 6, a equipe completa monta o seu mês de conteúdo."}, {"t": "fala", "x": "E um aviso que vale ouro: a inteligência artificial muda muito rápido. O botão que eu mostro hoje pode estar em outro lugar no mês que vem. Por isso eu te ensino as peças da obra, e não onde fica cada botão. As peças continuam as mesmas."}]}, {"n": "7", "nome": "A sua primeira obra", "meta": "4 min · tela + câmera", "fica": ["Hoje você deu a primeira ordem. Na próxima aula, ele aprende quem você é."], "itens": [{"t": "fala", "x": "Agora é a sua vez de dar a primeira ordem. São quatro passos, e eu faço junto com você."}, {"t": "fala", "x": "Primeiro, o plano. O Claude tem uma versão grátis, que serve pra conversar. Pra ele operar no seu computador, você precisa do plano pago de entrada, que se chama Pro. Eu não vou falar o valor porque ele muda, mas o link está no material desta aula."}, {"t": "fala", "x": "Segundo, instalar. Entra em claude.com/download, baixa o aplicativo, abre e faz o login com a sua conta. Pronto, está instalado."}, {"t": "fala", "x": "Terceiro, o canteiro. Na sua área de trabalho, cria uma pasta chamada Meu Conteúdo, e dentro dela uma pasta com o nome de um imóvel seu. Coloca ali as fotos, os vídeos que você gravou no celular e um arquivo com os dados: pode ser o PDF da construtora ou um texto seu com metragem, suítes, vagas e valor. Esse imóvel vai te acompanhar no curso inteiro."}, {"t": "fala", "x": "Quarto, a primeira ordem. Aqui na caixa de mensagem, eu adiciono a pasta do imóvel. Ele vai pedir licença pra mexer nela. Lê o aviso com calma: ele só vai enxergar essa pasta. Agora eu escrevo o pedido."}, {"t": "pedido", "x": "Organiza essa pasta: separa as fotos e os vídeos em duas pastas, renomeia cada foto pelo cômodo que aparece nela e me diz o que tem aqui."}, {"t": "fala", "x": "Olha a pasta aqui do lado enquanto ele trabalha. As fotos estão ganhando nome: sala, varanda, vista, suíte. Os vídeos foram pra outra pasta. E ele me contou o que tem no imóvel. Numa captação de duzentas fotos, isso é uma tarde inteira que volta pra você."}, {"t": "fala", "x": "E se ele errar um cômodo, corrige na conversa, do jeito que você falaria com uma pessoa: 'a foto 4 é a suíte, não o quarto'. Você é o dono da obra, e o dono confere."}, {"t": "gesto", "x": "volta pra câmera"}, {"t": "fala", "x": "Pronto. Você acabou de dar a sua primeira ordem pra uma IA operadora, e ela trabalhou no seu computador. Pausa o vídeo e faz agora, com o seu imóvel, antes de ir pra próxima aula."}, {"t": "fala", "x": "E na próxima aula você vai escrever o caderno de obra. A partir dela, o Claude vai saber quem você é, onde você trabalha e como você fala, e tudo o que ele escrever vai sair com a sua cara."}, {"t": "fala", "x": "Hoje você deu a primeira ordem. Na próxima aula, ele aprende quem você é. Te vejo lá."}]}]};
const $ = s => document.querySelector(s);
const texto = $('#texto'), raiz = document.documentElement;
const CHAVE = 'tp:' + DADOS.titulo;
let cfg = {vel: 8, fs: 36, espelho: false, parar: true, conta: true, pos: 0};
if (matchMedia('(orientation: landscape)').matches) cfg.fs = 42;
try { Object.assign(cfg, JSON.parse(localStorage.getItem(CHAVE) || '{}')); } catch (e) {}
const salva = () => { try { cfg.pos = scrollY; localStorage.setItem(CHAVE, JSON.stringify(cfg)); } catch (e) {} };

function esc(s) { return s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c])); }
function destaca(txt, fica) {
  let h = esc(txt);
  for (const f of fica) {
    const alvo = esc(f).replace(/[.!?]$/, '');
    const i = h.indexOf(alvo);
    if (i >= 0) {
      let fimI = i + alvo.length;
      if (/[.!?]/.test(h[fimI] || '')) fimI++;
      h = h.slice(0, i) + '<mark>' + h.slice(i, fimI) + '</mark>' + h.slice(fimI);
    }
  }
  return h;
}

let html = `<div class="capa"><small>teleprompter</small>${esc(DADOS.titulo)}</div>
<p class="dica">Toque no texto pra rolar ou pausar. A rolagem para sozinha no fim de cada parte. As frases sublinhadas são as que ficam: olhando pra câmera, 1 segundo de silêncio antes e depois.</p>`;
DADOS.partes.forEach((p, k) => {
  html += `<div class="cab" id="parte${k}" data-k="${k}">Parte ${esc(p.n)} · ${esc(p.nome)} <span>· ${esc(p.meta)}</span></div>`;
  for (const it of p.itens) {
    if (it.t === 'fala') html += `<p class="fala">${destaca(it.x, p.fica)}</p>`;
    else if (it.t === 'gesto') html += `<p class="gesto">${esc(it.x)}</p>`;
    else html += `<div class="pedido"><b>VOCÊ DIGITA</b>${esc(it.x)}</div>`;
  }
  html += `<div class="fim" data-k="${k}">fim da parte ${esc(p.n)}</div>`;
});
html += `<p class="acabou">Fim da aula. Corta! 🎬</p>`;
texto.innerHTML = html;

const cabs = [...document.querySelectorAll('.cab')];
const fins = [...document.querySelectorAll('.fim')];
const guiaY = () => innerHeight * parseFloat(getComputedStyle(raiz).getPropertyValue('--guia')) / 100;

function aplica() {
  raiz.style.setProperty('--fs', cfg.fs + 'px');
  $('#vVal').textContent = cfg.vel;
  $('#fVal').textContent = cfg.fs;
  document.body.classList.toggle('espelho', cfg.espelho);
  $('#bEspelho').classList.toggle('on', cfg.espelho);
  $('#bParar').classList.toggle('on', cfg.parar);
  $('#bConta').classList.toggle('on', cfg.conta);
}
aplica();

// rolagem
let rodando = false, pos = 0, ultimo = 0, tAnt = 0, travaFim = -1, wake = null;
function parteAtual() {
  const g = guiaY(); let k = 0;
  cabs.forEach((c, i) => { if (c.getBoundingClientRect().top <= g + 2) k = i; });
  return k;
}
function progresso() {
  const max = document.documentElement.scrollHeight - innerHeight;
  const pc = max > 0 ? Math.min(100, Math.round(scrollY / max * 100)) : 0;
  $('#barra i').style.width = pc + '%';
  $('#pct').textContent = pc + '%';
  $('#qual').textContent = 'Parte ' + DADOS.partes[parteAtual()].n + '/' + DADOS.partes.length;
}
function quadro(t) {
  if (!rodando) return;
  const dt = Math.min(0.1, (t - (tAnt || t)) / 1000); tAnt = t;
  if (Math.abs(scrollY - ultimo) > 3) pos = scrollY; // o dedo mexeu no texto
  pos += cfg.vel * 5 * dt;
  scrollTo(0, pos); ultimo = Math.round(pos);
  if (cfg.parar) {
    const g = guiaY();
    for (const f of fins) {
      const k = +f.dataset.k, top = f.getBoundingClientRect().top;
      if (top <= g && top > g - 60 && travaFim !== k) { travaFim = k; pausa(); break; }
    }
  }
  const max = document.documentElement.scrollHeight - innerHeight;
  if (pos >= max - 1) pausa();
  progresso();
  requestAnimationFrame(quadro);
}
async function pedeTela() {
  try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function comeca() {
  rodando = true; document.body.classList.add('rodando'); $('#play').textContent = '❚❚';
  pos = scrollY; ultimo = Math.round(pos); tAnt = 0; pedeTela();
  requestAnimationFrame(quadro);
}
let contando = null;
function play() {
  if (rodando || contando) return;
  if (!cfg.conta) return comeca();
  const el = $('#conta'); let n = 3; el.style.display = 'flex'; el.textContent = n;
  contando = setInterval(() => {
    n--; if (n > 0) { el.textContent = n; return; }
    clearInterval(contando); contando = null; el.style.display = 'none'; comeca();
  }, 800);
}
function pausa() {
  if (contando) { clearInterval(contando); contando = null; $('#conta').style.display = 'none'; }
  rodando = false; document.body.classList.remove('rodando'); $('#play').textContent = '▶';
  try { wake && wake.release(); } catch (e) {} wake = null; salva();
}
const alterna = () => (rodando || contando) ? pausa() : play();

function vaiParte(k) {
  pausa();
  const alvo = cabs[k].getBoundingClientRect().top + scrollY - guiaY() + 4;
  scrollTo(0, Math.max(0, alvo)); travaFim = k - 1; progresso(); salva();
}

// toque no texto: toque curto alterna; arrastar só rola
let toque = null;
texto.addEventListener('pointerdown', e => { toque = {y: e.clientY, t: Date.now()}; });
texto.addEventListener('pointerup', e => {
  if (toque && Math.abs(e.clientY - toque.y) < 10 && Date.now() - toque.t < 350) alterna();
  toque = null;
});

$('#play').onclick = alterna;
$('#vMenos').onclick = () => { cfg.vel = Math.max(1, cfg.vel - 1); aplica(); salva(); };
$('#vMais').onclick = () => { cfg.vel = Math.min(40, cfg.vel + 1); aplica(); salva(); };
$('#fMenos').onclick = () => { cfg.fs = Math.max(18, cfg.fs - 2); aplica(); salva(); };
$('#fMais').onclick = () => { cfg.fs = Math.min(96, cfg.fs + 2); aplica(); salva(); };
$('#bEspelho').onclick = () => { cfg.espelho = !cfg.espelho; aplica(); salva(); };
$('#bParar').onclick = () => { cfg.parar = !cfg.parar; aplica(); salva(); };
$('#bConta').onclick = () => { cfg.conta = !cfg.conta; aplica(); salva(); };
$('#bVolta').onclick = () => vaiParte(parteAtual());

const menu = $('#menu');
$('#bPartes').onclick = () => {
  const at = parteAtual();
  menu.innerHTML = '<h3>Ir para a parte</h3>' + DADOS.partes.map((p, k) =>
    `<button data-k="${k}" class="${k === at ? 'atual' : ''}">${esc(p.n)} · ${esc(p.nome)}<small>${esc(p.meta)}</small></button>`).join('') +
    '<button data-k="-1">Voltar ao começo</button><button data-k="x">Fechar</button>';
  menu.style.display = 'block';
};
menu.onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  menu.style.display = 'none';
  if (b.dataset.k === 'x') return;
  if (b.dataset.k === '-1') { pausa(); scrollTo(0, 0); travaFim = -1; progresso(); salva(); return; }
  vaiParte(+b.dataset.k);
};

// controle remoto / teclado bluetooth
addEventListener('keydown', e => {
  const k = e.key;
  if ([' ', 'Enter', 'PageDown', 'ArrowRight', 'MediaPlayPause'].includes(k)) { e.preventDefault(); alterna(); }
  else if (k === 'ArrowUp') { e.preventDefault(); $('#vMais').onclick(); }
  else if (k === 'ArrowDown') { e.preventDefault(); $('#vMenos').onclick(); }
  else if (k === 'PageUp' || k === 'ArrowLeft') { e.preventDefault(); vaiParte(parteAtual()); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && rodando) pedeTela(); else if (document.visibilityState === 'hidden') salva(); });
addEventListener('scroll', () => { if (!rodando) progresso(); }, {passive: true});

addEventListener('load', () => { if (cfg.pos > 0) scrollTo(0, cfg.pos); progresso(); });
</script>
</body>
</html>
